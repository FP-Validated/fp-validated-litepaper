apiVersion: apps/v1
kind: Deployment
metadata:
  name: fp-validated-litepaper
  namespace: litepaper
  labels:
    app.kubernetes.io/name: fp-validated-litepaper
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fp-validated-litepaper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fp-validated-litepaper
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      nodeSelector:
        kubernetes.io/hostname: ovh-node-9
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: nginx
          image: ghcr.io/fp-validated/fp-validated-litepaper:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "25m"
              memory: 32Mi
            limits:
              cpu: "250m"
              memory: 128Mi
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
