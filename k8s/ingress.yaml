apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fp-validated-litepaper
  namespace: litepaper
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http01
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: litepaper.4pillars.info
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fp-validated-litepaper
                port:
                  name: http
  tls:
    - hosts:
        - litepaper.4pillars.info
      secretName: fp-validated-litepaper-tls
