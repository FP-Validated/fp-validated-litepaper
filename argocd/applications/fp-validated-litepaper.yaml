apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fp-validated-litepaper
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: fleet
  source:
    repoURL: https://github.com/FP-Validated/fp-validated-litepaper.git
    targetRevision: main
    path: k8s
  destination:
    server: https://10.50.8.68:16443
    namespace: litepaper
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
